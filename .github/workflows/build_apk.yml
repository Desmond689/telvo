name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Verify Cloudinary Configuration
        shell: bash
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          set -euo pipefail
          missing=()

          # Check if the values were provided as repository secrets
          if [ -z "${CLOUDINARY_CLOUD_NAME:-}" ]; then
            # Try falling back to .env.example values (CI usually copies .env from secrets)
            if [ -f .env ] && grep -q '^CLOUDINARY_CLOUD_NAME=' .env && ! grep -q "^CLOUDINARY_CLOUD_NAME=your_" .env; then
              : # ok: .env has value
            else
              missing+=('CLOUDINARY_CLOUD_NAME')
            fi
          fi

          if [ -z "${CLOUDINARY_UPLOAD_PRESET:-}" ]; then
            if [ -f .env ] && grep -q '^CLOUDINARY_UPLOAD_PRESET=' .env && ! grep -q "^CLOUDINARY_UPLOAD_PRESET=your_" .env; then
              :
            else
              missing+=('CLOUDINARY_UPLOAD_PRESET')
            fi
          fi

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error title=Cloudinary configuration::Missing Cloudinary configuration: ${missing[*]}"
            echo "The build requires Cloudinary configuration for unsigned uploads."
            echo "Please add the following repository secrets in GitHub:"
            echo "  - CLOUDINARY_CLOUD_NAME (your Cloudinary cloud name)"
            echo "  - CLOUDINARY_UPLOAD_PRESET (an unsigned upload preset name)"
            echo "Or ensure a .env file (from secrets or CI) contains valid values (replace the 'your_...' placeholders in .env.example)."
            echo "See README.md -> 'Cloudinary configuration for CI' for detailed setup steps."
            exit 1
          fi

          echo "Cloudinary configuration present. Continuing build."

      - name: Install Flutter SDK (pinned)
        run: |
          set -e
          echo "Installing Flutter (stable branch)"
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
          # Make flutter available in this step immediately and for following steps
          export PATH="$HOME/flutter/bin:$PATH"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter --version
          flutter precache

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare `.env` file for CI build
        run: cp .env.example .env

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
